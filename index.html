<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSL TMS 등록 관리</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">DSL TMS v01</p>
        <h1>운송관리 등록 콘솔</h1>
        <p>거래처부터 사진 업로드까지 운송 운영에 필요한 기준 정보를 한 화면에서 등록합니다.</p>
      </div>
      <div class="summary-card">
        <span>전체 등록 건수</span>
        <strong id="totalCount">0건</strong>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="등록 메뉴">
        <h2>등록 항목</h2>
        <nav id="moduleNavigation" class="module-navigation"></nav>
      </aside>

      <section class="content">
        <form id="registrationForm" class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Registration</p>
              <h2 id="formTitle"></h2>
              <p id="formDescription"></p>
            </div>
            <button type="submit" class="primary-button">저장</button>
          </div>
          <div id="formFields" class="form-grid"></div>
          <div id="photoPreview" class="photo-preview" hidden></div>
        </form>

        <section class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Saved data</p>
              <h2 id="listTitle"></h2>
            </div>
            <span id="activeModuleCount" class="pill">0건</span>
          </div>
          <ul id="recordsList" class="records-list"></ul>
        </section>
      </section>
    </main>

    <div id="notice" class="notice" hidden></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
